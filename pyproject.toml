[project]
name = "sap-help-mcp"
version = "1.0.0"
description = "MCP server that searches SAP Help Portal and SAP Community from your AI assistant"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Andrey Amelin" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "sap",
    "sap-help",
    "sap-community",
    "claude",
    "abap",
    "s4hana",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=3.0,<4.0",
    "markdownify>=0.11,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/aamelin1/sap-help-mcp"
Repository = "https://github.com/aamelin1/sap-help-mcp"
Issues = "https://github.com/aamelin1/sap-help-mcp/issues"
Changelog = "https://github.com/aamelin1/sap-help-mcp/blob/main/CHANGELOG.md"

# Console script: this is what `uvx sap-help-mcp` runs.
[project.scripts]
sap-help-mcp = "sap_help_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sap_help_mcp"]
# py.typed has no extension pattern hatchling picks up automatically
artifacts = ["src/sap_help_mcp/py.typed"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
