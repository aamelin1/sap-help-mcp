name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6

      # Pinned to an exact version on purpose: unlike the other actions used here,
      # setup-uv publishes no floating major tag for the v8 line, so @v8 does not
      # resolve. Dependabot keeps this pin current.
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Run the offline test suite
        run: uv run --python ${{ matrix.python }} --extra dev pytest

      - name: Console script is installed and runnable
        run: uv run --python ${{ matrix.python }} sap-help-mcp --version

  versions-agree:
    name: version numbers agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compare pyproject.toml, __init__.py and manifest.json
        run: |
          python - <<'PY'
          import json, pathlib, re, sys

          root = pathlib.Path(".")
          pyproject = re.search(r'(?m)^version\s*=\s*"([^"]+)"',
                                (root / "pyproject.toml").read_text()).group(1)
          package = re.search(r'(?m)^__version__\s*=\s*"([^"]+)"',
                              (root / "src/sap_help_mcp/__init__.py").read_text()).group(1)
          manifest = json.loads((root / "manifest.json").read_text())["version"]

          print(f"pyproject={pyproject} package={package} manifest={manifest}")
          if not pyproject == package == manifest:
              sys.exit("Version mismatch: bump all three together.")
          PY

  bundle-builds:
    name: .mcpb bundle packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Pack the bundle
        run: npx --yes @anthropic-ai/mcpb pack . sap-help-mcp.mcpb
      - name: Show what ended up inside
        run: unzip -l sap-help-mcp.mcpb
      - name: Nothing pre-installed may be shipped
        run: |
          if unzip -l sap-help-mcp.mcpb | grep -E "(^|/)(\.venv|server/lib|server/venv)/"; then
            echo "::error::The bundle ships pre-installed packages; the uv runtime forbids that."
            exit 1
          fi
          for required in manifest.json pyproject.toml uv.lock README.md LICENSE NOTICE \
                          src/sap_help_mcp/__main__.py; do
            unzip -l sap-help-mcp.mcpb | grep -q " $required$" \
              || { echo "::error::$required is missing from the bundle"; exit 1; }
          done
          echo "Bundle contents look right."
