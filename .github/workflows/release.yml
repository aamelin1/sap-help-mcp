name: Release

# Tag a commit with vX.Y.Z and push the tag:
#   git tag v1.0.0 && git push origin v1.0.0
# This builds the wheel, publishes it to PyPI, packs the .mcpb bundle and
# attaches it to a GitHub release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build wheel, sdist and .mcpb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Exact pin: setup-uv does not publish a floating major tag for every line,
      # so @v<major> cannot be relied on. Dependabot keeps it current.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: The tag must match the version in the tree
        run: |
          python - <<'PY'
          import json, os, pathlib, re, sys

          root = pathlib.Path(".")
          pyproject = re.search(r'(?m)^version\s*=\s*"([^"]+)"',
                                (root / "pyproject.toml").read_text()).group(1)
          package = re.search(r'(?m)^__version__\s*=\s*"([^"]+)"',
                              (root / "src/sap_help_mcp/__init__.py").read_text()).group(1)
          manifest = json.loads((root / "manifest.json").read_text())["version"]
          tag = os.environ["GITHUB_REF_NAME"]

          print(f"tag={tag} pyproject={pyproject} package={package} manifest={manifest}")
          if not pyproject == package == manifest:
              sys.exit("Version mismatch between pyproject, package and manifest.")
          if tag != f"v{pyproject}":
              sys.exit(f"Tag {tag} does not match version {pyproject}.")

          # Checked here rather than in the release job so a missing entry stops the
          # run before anything reaches PyPI, which cannot be undone.
          changelog = (root / "CHANGELOG.md").read_text(encoding="utf-8")
          if not re.search(rf"(?m)^## \[{re.escape(pyproject)}\]", changelog):
              sys.exit(f"CHANGELOG.md has no '## [{pyproject}]' section.")
          PY

      - name: Tests must pass before anything is published
        run: uv run --extra dev pytest

      - name: Build the Python distributions
        run: uv build

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Pack the MCPB bundle
        run: npx --yes @anthropic-ai/mcpb pack . sap-help-mcp.mcpb

      # Two separate artifacts on purpose: the PyPI job must receive the wheel and
      # sdist and nothing else, and neither job then has to guess how the artifact
      # preserved its directory nesting.
      - name: Upload the Python distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

      - name: Upload the MCPB bundle
        uses: actions/upload-artifact@v7
        with:
          name: mcpb-bundle
          path: sap-help-mcp.mcpb
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Configure a PyPI "trusted publisher" for this repository and workflow;
    # no API token is stored anywhere.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Attach the bundle to a GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout first: it cleans the working directory, which would delete the
      # artifacts if they were downloaded before it.
      - uses: actions/checkout@v7

      # Without this the release body is whatever GitHub can infer from merged pull
      # requests, so a fix pushed straight to main shows up as "no changes".
      - name: Take the release notes from the changelog
        run: |
          python - <<'PY'
          import os, pathlib, re, sys

          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.search(
              rf"(?ms)^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text)
          if not section:
              sys.exit(f"CHANGELOG.md has no section for {version}.")
          body = section.group(1).strip()
          pathlib.Path("release_body.md").write_text(body + "\n", encoding="utf-8")
          print(body)
          PY

      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: mcpb-bundle
          path: .

      # body_path plus generate_release_notes: the action documents the body as
      # pre-pended to the generated notes, so the changelog leads and the commit and
      # pull-request summary follows it.
      - uses: softprops/action-gh-release@v3.0.2
        with:
          body_path: release_body.md
          generate_release_notes: true
          files: |
            sap-help-mcp.mcpb
            dist/*
